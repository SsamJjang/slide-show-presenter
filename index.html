<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Deck — Presentation Studio</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/present.css">
<!-- Slide styling is injected from js/slide-css.js so the exporter can embed
     it without fetch(), which is blocked on file:// pages. -->
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <input id="deckTitle" class="deck-title" value="Untitled Deck" spellcheck="false">
  </div>

  <div class="tb-group">
    <button class="tb" data-act="undo" title="Undo (Ctrl+Z)">${icon:undo}</button>
    <button class="tb" data-act="redo" title="Redo (Ctrl+Shift+Z)">${icon:redo}</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group" id="insertGroup">
    <button class="tb" data-insert="text"   title="Text (T)">${icon:text}</button>
    <button class="tb" data-insert="shape"  title="Shape (S)">${icon:shape}</button>
    <button class="tb" data-insert="image"  title="Image (I)">${icon:image}</button>
    <button class="tb" data-insert="chart"  title="Chart">${icon:chart}</button>
    <button class="tb" data-insert="mockup" title="Device mockup">${icon:device}</button>
    <button class="tb" data-insert="code"   title="Code block">${icon:code}</button>
    <button class="tb" data-insert="table"  title="Table">${icon:table}</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb" data-act="layouts" title="Slide layouts">${icon:layout}<span>Layouts</span></button>
    <button class="tb" data-act="theme"   title="Deck theme">${icon:palette}<span>Theme</span></button>
  </div>

  <div class="spacer"></div>

  <div class="tb-group">
    <button class="tb" data-act="shortcuts" title="Keyboard shortcuts (?)">${icon:key}</button>
    <button class="tb" data-act="export" title="Export">${icon:export}<span>Export</span></button>
    <button class="tb primary" data-act="present" title="Present (Ctrl+Enter)">${icon:play}<span>Present</span></button>
  </div>
</header>

<!-- ============ WORKSPACE ============ -->
<main class="workspace">

  <!-- Slide sorter -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <span>Slides</span>
      <button class="mini" data-act="addSlide" title="New slide (Ctrl+M)">+</button>
    </div>
    <div class="rail-list" id="railList"></div>
    <div class="rail-foot">
      <button class="ghost" data-act="addSlide">New slide</button>
    </div>
  </aside>

  <!-- Canvas -->
  <section class="stage" id="stage">
    <div class="stage-scroll" id="stageScroll">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas" id="canvas"></div>
        <svg class="guides" id="guides"></svg>
        <div class="selection" id="selection" hidden>
          <div class="handle" data-h="nw"></div><div class="handle" data-h="n"></div><div class="handle" data-h="ne"></div>
          <div class="handle" data-h="w"></div><div class="handle" data-h="e"></div>
          <div class="handle" data-h="sw"></div><div class="handle" data-h="s"></div><div class="handle" data-h="se"></div>
          <div class="rotator" data-h="rot"></div>
        </div>
      </div>
    </div>

    <div class="stage-bar">
      <div class="zoom">
        <button class="mini" data-act="zoomOut">−</button>
        <span id="zoomLabel">Fit</span>
        <button class="mini" data-act="zoomIn">+</button>
        <button class="mini" data-act="zoomFit">Fit</button>
      </div>
      <div class="stage-status" id="stageStatus">Slide 1 of 1</div>
      <div class="notes-toggle">
        <button class="mini" data-act="toggleNotes">Speaker notes</button>
      </div>
    </div>

    <div class="notes-drawer" id="notesDrawer" hidden>
      <label>Speaker notes — slide <b id="notesSlideNo">1</b></label>
      <textarea id="notesArea" placeholder="What you'll say on this slide. Visible in Presenter View, never on the projector."></textarea>
    </div>
  </section>

  <!-- Inspector -->
  <aside class="inspector" id="inspector"></aside>
</main>

<!-- ============ OVERLAYS ============ -->
<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheetPanel"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Presentation surface -->
<div class="present-root" id="presentRoot" hidden>
  <div class="present-stage" id="presentStage"></div>
  <div class="present-hud" id="presentHud">
    <div class="hud-progress"><i id="hudBar"></i></div>
    <div class="hud-row">
      <span id="hudNum">1 / 1</span>
      <span id="hudTimer">00:00</span>
      <span class="hud-hint">← → navigate · B black · W white · Esc exit</span>
    </div>
  </div>
  <div class="present-blank" id="presentBlank" hidden></div>
</div>

<input type="file" id="filePicker" hidden>

<script src="js/slide-css.js"></script>
<script src="js/icons.js"></script>
<script src="js/palette.js"></script>
<script src="js/model.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/shapes.js"></script>
<script src="js/motion.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/charts.js"></script>
<script src="js/templates.js"></script>
<script src="js/inspector.js"></script>
<script src="js/canvas.js"></script>
<script src="js/rail.js"></script>
<script src="js/present.js"></script>
<script src="js/exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
