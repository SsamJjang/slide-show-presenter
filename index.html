<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Deck — Presentation Studio</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/present.css">
<!-- Slide styling is injected from js/slide-css.js so the exporter can embed
     it without fetch(), which is blocked on file:// pages. -->
</head>
<body>

<!-- ============ TOP BAR ============
     Only what applies to the whole deck. Everything you put ON a slide lives
     in the library on the left; everything about the selection lives in the
     inspector on the right. -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <input id="deckTitle" class="deck-title" value="Untitled Deck" spellcheck="false" aria-label="Deck title">
  </div>

  <div class="tb-group">
    <button class="tb" data-act="undo" title="Undo (Ctrl+Z)">${icon:undo}</button>
    <button class="tb" data-act="redo" title="Redo (Ctrl+Shift+Z)">${icon:redo}</button>
  </div>

  <div class="spacer"></div>

  <div class="tb-group">
    <div class="menu-wrap">
      <button class="tb" data-act="menu" title="More">${icon:more}</button>
      <div class="menu" id="mainMenu" hidden>
        <button data-act="theme">${icon:palette}<span>Theme &amp; accent</span><kbd>Ctrl K</kbd></button>
        <button data-act="connectDeck">${icon:spark}<span>Open the sample Connect deck</span></button>
        <button data-act="shortcuts">${icon:key}<span>Keyboard shortcuts</span><kbd>?</kbd></button>
      </div>
    </div>
    <button class="tb" data-act="export" title="Export (Ctrl+E)">${icon:export}<span>Export</span></button>
    <button class="tb primary" data-act="present" title="Present from this slide (Ctrl+Enter from the start)">${icon:play}<span>Present</span></button>
  </div>
</header>

<!-- ============ WORKSPACE ============ -->
<main class="workspace" id="workspace">

  <!-- Library: what you can put on a slide. Click to add, or drag onto the canvas. -->
  <nav class="dock" id="dock" aria-label="Library">
    <button class="dk" data-pane="elements" title="Elements">${icon:shape}<span>Elements</span></button>
    <button class="dk" data-pane="text" title="Text">${icon:text}<span>Text</span></button>
    <button class="dk" data-pane="media" title="Media">${icon:image}<span>Media</span></button>
    <button class="dk" data-pane="backgrounds" title="Backgrounds">${icon:palette}<span>Background</span></button>
    <button class="dk" data-pane="layouts" title="Layouts">${icon:layout}<span>Layouts</span></button>
  </nav>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <input class="drawer-search" id="drawerSearch" placeholder="Search" spellcheck="false" aria-label="Search the library">
      <button class="mini" data-act="closeDrawer" title="Hide the library">${icon:close}</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- Canvas -->
  <section class="stage" id="stage">
    <div class="stage-scroll" id="stageScroll">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas" id="canvas"></div>
        <svg class="guides" id="guides"></svg>
        <div class="selection" id="selection" hidden>
          <div class="handle" data-h="nw"></div><div class="handle" data-h="n"></div><div class="handle" data-h="ne"></div>
          <div class="handle" data-h="w"></div><div class="handle" data-h="e"></div>
          <div class="handle" data-h="sw"></div><div class="handle" data-h="s"></div><div class="handle" data-h="se"></div>
          <div class="rotator" data-h="rot"></div>
        </div>
      </div>
    </div>

    <div class="stage-bar">
      <div class="zoom">
        <button class="mini" data-act="zoomOut" title="Zoom out">−</button>
        <span id="zoomLabel">Fit</span>
        <button class="mini" data-act="zoomIn" title="Zoom in">+</button>
        <button class="mini" data-act="zoomFit">Fit</button>
      </div>
      <div class="stage-status" id="stageStatus">Slide 1 of 1</div>
      <div class="stage-acts">
        <button class="mini" data-act="preview" title="Play this slide's entrance on the canvas">${icon:play} Preview</button>
        <button class="mini" data-act="toggleNotes">Notes</button>
      </div>
    </div>

    <div class="notes-drawer" id="notesDrawer" hidden>
      <label>Speaker notes — slide <b id="notesSlideNo">1</b></label>
      <textarea id="notesArea" placeholder="What you'll say on this slide. Visible in Presenter View, never on the projector."></textarea>
    </div>

    <!-- Filmstrip -->
    <div class="strip" id="rail">
      <div class="rail-list" id="railList"></div>
      <button class="strip-add" data-act="addSlide" title="New slide (Ctrl+M)">+</button>
    </div>
  </section>

  <!-- Inspector: only what applies to the current selection. -->
  <aside class="inspector" id="inspector"></aside>
</main>

<!-- ============ OVERLAYS ============ -->
<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheetPanel"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- Presentation surface -->
<div class="present-root" id="presentRoot" hidden>
  <!-- Atmosphere lives outside the slide stack so it never restarts on advance. -->
  <div class="present-atmos" id="presentAtmos"></div>
  <div class="present-stage" id="presentStage"></div>
  <div class="present-hud" id="presentHud">
    <div class="hud-progress"><i id="hudBar"></i></div>
    <div class="hud-row">
      <span id="hudNum">1 / 1</span>
      <span id="hudTimer">00:00</span>
      <span class="hud-hint">← → navigate · B black · W white · Esc exit</span>
    </div>
  </div>
  <div class="present-blank" id="presentBlank" hidden></div>
</div>

<input type="file" id="filePicker" hidden>

<script src="js/slide-css.js"></script>
<script src="js/icons.js"></script>
<script src="js/palette.js"></script>
<script src="js/model.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/shapes.js"></script>
<script src="js/motion.js"></script>
<script src="js/connect.js"></script>
<script src="js/flow.js"></script>
<script src="js/kit.js"></script>
<script src="js/continuity.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/charts.js"></script>
<script src="js/templates.js"></script>
<script src="js/inspector.js"></script>
<script src="js/canvas.js"></script>
<script src="js/rail.js"></script>
<script src="js/library.js"></script>
<script src="js/present.js"></script>
<script src="js/exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
