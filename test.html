<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Deck — Tests</title>
<!--
  The deck's test suite. Open it through the test server
  (python devserver.py → http://localhost:5599/test.html); it re-runs on
  every save.

  It drives the real app inside an iframe at index.html?sandbox, which saves
  under separate storage keys, so nothing here can touch the deck you are
  editing. Your saved deck is READ (never written) so its slides get the
  same layout checks as the built-in ones.

  What it checks, and why each one exists:
    boot        the app and every module load
    form        the Connect form's shader compiles on this machine
    layouts     every layout renders, and no text overflows its box
    your deck   the same, for the deck you saved in the editor
    flow        every slide change plays in the right order: the outgoing
                headline leaves last, the incoming headline arrives before
                its copy, media after text
    present     Present opens on the selected slide; resizing (entering
                fullscreen) never rebuilds the slide; a second talk still
                has a working form
    export      the standalone HTML compiles, plays every slide forward and
                back without errors, and ends on visible content
-->
<style>
  :root {
    --bg: #0b0c0f; --panel: #121419; --line: rgba(255,255,255,.08);
    --ink: #eef0f4; --muted: #8d93a1; --pass: #3ddc97; --fail: #ff5d6c; --run: #7aa7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 'Inter', 'Segoe UI Variable Text', system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  #summary { color: var(--muted); font-variant-numeric: tabular-nums; }
  #summary.ok { color: var(--pass); } #summary.bad { color: var(--fail); }
  button {
    margin-left: auto; height: 32px; padding: 0 14px; border-radius: 8px; cursor: pointer;
    background: #1b1e25; color: var(--ink); border: 1px solid var(--line); font: inherit;
  }
  button:hover { border-color: rgba(255,255,255,.22); }
  main { padding: 16px 24px 48px; max-width: 1100px; }
  .group { margin: 18px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
           text-transform: uppercase; color: var(--muted); }
  .t {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start;
    padding: 9px 12px; border-radius: 8px; background: var(--panel); margin-bottom: 6px;
    border: 1px solid var(--line);
  }
  .t .mark { font-weight: 700; }
  .t.pass .mark { color: var(--pass); } .t.fail .mark { color: var(--fail); }
  .t.run .mark { color: var(--run); }
  .t .ms { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .t .detail { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; white-space: pre-wrap;
               overflow-wrap: anywhere; }
  .t.fail .detail { color: #ffb3ba; }
  /* The app under test. Real size, so text measurement is honest; parked
     off-screen so it doesn't flash over the results. */
  #app { position: fixed; left: -3000px; top: 0; width: 1280px; height: 800px; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Apex Deck tests</h1>
  <span id="summary">starting…</span>
  <button id="again">Run again</button>
</header>
<main id="out"></main>
<iframe id="app" title="App under test"></iframe>

<script>
(() => {
  const out = document.getElementById('out');
  const summary = document.getElementById('summary');
  const frame = document.getElementById('app');
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  let W;                          // the app's window
  /* The app's modules are top-level consts, which are not properties of its
     window — so they are looked up by name inside it. */
  const X = new Proxy({}, { get: (_, k) => { try { return W.eval(String(k)); } catch { return undefined; } } });
  let results = [];

  /* ---------- tiny runner ---------- */

  function row(name) {
    const el = document.createElement('div');
    el.className = 't run';
    el.innerHTML = `<span class="mark">…</span><span class="name"></span><span class="ms"></span><div class="detail"></div>`;
    el.querySelector('.name').textContent = name;
    out.appendChild(el);
    return el;
  }
  function group(name) {
    const g = document.createElement('div'); g.className = 'group'; g.textContent = name;
    out.appendChild(g);
  }
  async function test(name, fn) {
    const el = row(name), t0 = performance.now();
    let pass = false, detail = '';
    try {
      const r = await fn();
      if (r === true || r === undefined) pass = true;
      else if (typeof r === 'string') detail = r;
      else { pass = !!r.pass; detail = r.detail || ''; }
    } catch (e) { detail = (e && e.stack) ? e.stack.split('\n').slice(0, 3).join('\n') : String(e); }
    el.className = 't ' + (pass ? 'pass' : 'fail');
    el.querySelector('.mark').textContent = pass ? '✓' : '✗';
    el.querySelector('.ms').textContent = Math.round(performance.now() - t0) + ' ms';
    el.querySelector('.detail').textContent = detail;
    results.push(pass);
    paintSummary(false);
  }
  function paintSummary(done) {
    const p = results.filter(Boolean).length, f = results.length - p;
    summary.textContent = done ? (f ? `${f} failed, ${p} passed` : `all ${p} passed`) : `${p} passed, ${f} failed…`;
    summary.className = done ? (f ? 'bad' : 'ok') : '';
  }

  function loadApp() {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('app did not boot within 15s')), 15000);
      frame.onload = async () => {
        W = frame.contentWindow;
        const ready = () => { try { return W.eval('typeof App !== "undefined" && !!Store.deck'); } catch { return false; } };
        for (let i = 0; i < 100 && !ready(); i++) await sleep(50);
        clearTimeout(t);
        ready() ? resolve() : reject(new Error('App / Store never appeared'));
      };
      frame.src = 'index.html?sandbox&t=' + Date.now();
    });
  }

  /* ---------- helpers that run inside the app ---------- */

  // A rendered, measurable slide at full size, in the app's document.
  function mount(slide, deck) {
    const box = W.document.createElement('div');
    box.style.cssText = 'position:fixed;left:-4000px;top:0;width:1920px;height:1080px;overflow:hidden';
    X.applyTheme(box, deck.theme, deck);
    const host = X.Render.slideNode(slide, deck, { scale: 1, noForm: true });
    box.appendChild(host);
    W.document.body.appendChild(box);
    return { host, remove: () => box.remove() };
  }

  const label = (el) => {
    const t = el.querySelector('.e-text');
    return t ? '"' + t.textContent.replace(/\s+/g, ' ').trim().slice(0, 34) + '"' : el.className.replace(/^el el-/, '');
  };

  // Text that spills out of its box: the commonest thing to break when you
  // put your own words into a layout.
  function overflowIn(slide, deck) {
    const m = mount(slide, deck), bad = [];
    m.host.querySelectorAll('.el').forEach(el => {
      const box = el.querySelector('.e-text'), tx = box && box.querySelector('.tx');
      if (!tx) return;
      const over = tx.scrollHeight - box.clientHeight, wide = tx.scrollWidth - box.clientWidth;
      if (over > 6 || wide > 6) bad.push(`${label(el)} spills ${over > 6 ? over + 'px down' : wide + 'px across'}`);
    });
    m.remove();
    return bad;
  }

  const kindOf = (el) => {
    const t = el.querySelector('.e-text');
    if (t) {
      if (/role-(display|title)/.test(t.className)) return 'head';
      if (/role-kicker/.test(t.className)) return 'kicker';
      return 'copy';
    }
    return /el-(mockup|image|chart|code|table)/.test(el.className) ? 'media' : 'other';
  };
  const delayOf = (el) => {
    const a = el.querySelector('.el-anim').getAnimations().slice(-1)[0];
    return a ? a.effect.getTiming().delay : null;
  };

  // The order rules, checked on one slide change.
  function flowProblems(fromSlide, toSlide, deck) {
    const a = mount(fromSlide, deck), b = mount(toSlide, deck);
    const fl = X.connectFlow(a.host, b.host);
    const probs = [];
    const timed = (h) => [...h.querySelectorAll('.el')]
      .map(el => ({ el, k: kindOf(el), d: delayOf(el) })).filter(x => x.d != null);
    const outs = timed(a.host), ins = timed(b.host);

    const lastHeadOut = Math.max(-1, ...outs.filter(x => x.k === 'head').map(x => x.d));
    outs.filter(x => x.k === 'copy' || x.k === 'media').forEach(x => {
      if (lastHeadOut >= 0 && x.d > lastHeadOut) probs.push(`out: ${label(x.el)} leaves after the headline`);
    });
    // Slides with no headline (an app row, a live demo) have nothing to lead.
    const heads = ins.filter(x => x.k === 'head');
    const firstHeadIn = Math.min(...heads.map(x => x.d));
    if (heads.length) ins.filter(x => x.k === 'media').forEach(x => {
      if (x.d < firstHeadIn) probs.push(`in: ${label(x.el)} arrives before the headline`);
    });
    // Copy may sit inside a card that legitimately follows the headline; only
    // free-standing copy above the headline is an error.
    const head = ins.find(x => x.k === 'head');
    if (head) ins.filter(x => x.k === 'copy').forEach(x => {
      const above = parseFloat(x.el.style.top) < parseFloat(head.el.style.top);
      if (!above && x.d < head.d) probs.push(`in: ${label(x.el)} arrives before the headline`);
    });
    if (fl.duration > 3200) probs.push(`takes ${Math.round(fl.duration)} ms (over 3.2 s)`);
    a.remove(); b.remove();
    return probs;
  }

  function savedDeck() {
    try {
      const raw = localStorage.getItem('apexdeck.current');   // read only — never written
      const d = raw && JSON.parse(raw);
      return d && Array.isArray(d.slides) && d.slides.length ? X.Persist.migrate(d) : null;
    } catch { return null; }
  }

  /* ---------- the suite ---------- */

  async function run() {
    results = []; out.innerHTML = ''; summary.textContent = 'running…'; summary.className = '';

    group('Boot');
    await test('App loads in a sandbox', loadApp);
    if (!W || !X.Store) { paintSummary(true); return; }
    await test('Every module is present', () => {
      const need = ['Store', 'Render', 'Present', 'Exporter', 'Continuity', 'ConnectForm', 'Connect',
                    'connectFlow', 'connectFormRuntime', 'LAYOUTS', 'THEMES', 'connectDeck',
                    'Kit', 'Library', 'connectLiven'];
      const missing = need.filter(n => { try { return typeof W.eval(n) === 'undefined'; } catch { return true; } });
      return missing.length ? 'missing: ' + missing.join(', ') : true;
    });
    await test('Sandbox storage is separate from your deck', () =>
      /sandbox/.test(W.location.search) ? true : 'the app is not running in sandbox mode');
    await test('Connect form shader compiles', () => {
      const url = X.ConnectForm.snapshot({ pose: 'hero', scheme: 'connect' });
      return /^data:image\//.test(url) ? true : 'no WebGL, or the shader failed — see the console';
    });

    group('Layouts');
    const deck = X.connectDeck();
    await test(`All ${Object.keys(X.LAYOUTS).length} layouts render without overflowing`, () => {
      const bad = [];
      Object.entries(X.LAYOUTS).forEach(([k, l]) => {
        const s = X.makeSlide({ ...(l.slide || {}), elements: l.build() });
        overflowIn(s, deck).forEach(p => bad.push(`${k}: ${p}`));
      });
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    });
    await test(`Built-in deck (${deck.slides.length} slides) has no overflowing text`, () => {
      const bad = [];
      deck.slides.forEach((s, i) => overflowIn(s, deck).forEach(p => bad.push(`slide ${i + 1}: ${p}`)));
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    });
    const mine = savedDeck();
    await test(mine ? `Your deck “${mine.title}” (${mine.slides.length} slides) has no overflowing text`
                    : 'Your deck — none saved yet', () => {
      if (!mine) return true;
      const bad = [];
      mine.slides.forEach((s, i) => overflowIn(s, mine).forEach(p => bad.push(`slide ${i + 1}: ${p}`)));
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    });

    group('Element library');
    await test('Every library preset renders', () => {
      const bad = [];
      X.Kit.CATALOG.forEach(g => g.items.forEach(it => {
        try {
          const html = X.Render.elementBody(X.makeElement(it.type, { ...it.patch, w: it.w, h: it.h }));
          if (!html || html.length < 40) bad.push(`${g.group} / ${it.name}: rendered nothing`);
        } catch (e) { bad.push(`${g.group} / ${it.name}: ${e.message}`); }
      }));
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    });
    await test('Every library pane opens with tiles', () => {
      const bad = [];
      ['elements', 'text', 'media', 'backgrounds', 'layouts'].forEach(p => {
        if (X.Library.pane === p && !W.document.getElementById('workspace').classList.contains('no-drawer')) X.Library.render();
        else X.Library.open(p);
        const n = W.document.querySelectorAll('#drawerBody .tile').length;
        if (!n) bad.push(`${p}: no tiles`);
      });
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    });
    await test('Clicking a library tile adds it to the slide', async () => {
      X.Store.deck = X.connectDeck();
      X.Store.gotoSlide(0);
      X.Library.open('elements'); if (W.document.getElementById('workspace').classList.contains('no-drawer')) X.Library.open('elements');
      const before = X.Store.currentSlide().elements.length;
      const t = [...W.document.querySelectorAll('#drawerBody .tile')].find(x => x.title === 'Lens row');
      if (!t) return 'no "Lens row" tile';
      t.click(); await sleep(60);
      const after = X.Store.currentSlide().elements;
      return after.length === before + 1 && after[after.length - 1].type === 'lens'
        ? true : `expected a new lens, slide has ${after.map(e => e.type).join(', ')}`;
    });
    await test('Inspector tabs switch between Design, Motion and Position', async () => {
      const tabs = () => [...W.document.querySelectorAll('.insp-tabs button')];
      const hit = (label) => tabs().find(b => b.textContent.trim() === label);
      const probs = [];
      for (const [label, expect] of [['Motion', 'Entrance'], ['Position', 'Size and place'], ['Design', 'Lens field']]) {
        const b = hit(label); if (!b) { probs.push(`no ${label} tab`); continue; }
        b.click(); await sleep(30);
        if (!W.document.getElementById('inspector').textContent.includes(expect)) probs.push(`${label} tab lacks "${expect}"`);
      }
      return probs.length ? probs.join('\n') : true;
    });

    group('Choreography');
    await test('Graphics build first and leave last', () => {
      const s = X.makeSlide({ elements: [
        X.makeElement('text', { role: 'title', text: 'Headline', x: 140, y: 140, w: 900, h: 100 }),
        X.makeElement('sculpture', { x: 1000, y: 200, w: 700, h: 700 }),
        X.makeElement('wires', { x: 0, y: 500, w: 1920, h: 500 }),
      ]});
      const e2 = X.makeSlide({ elements: [X.makeElement('text', { role: 'title', text: 'Next', x: 140, y: 140, w: 900, h: 100 })] });
      const a = mount(s, deck), b = mount(X.makeSlide({ elements: [] }), deck);
      const fin = X.connectFlow(null, a.host);
      const ins = [...a.host.querySelectorAll('.el')].map(el => ({ k: kindOf(el), t: el.className, d: delayOf(el) }));
      const head = ins.find(x => x.k === 'head').d, art = ins.filter(x => /sculpture|wires/.test(x.t)).map(x => x.d);
      a.remove(); b.remove();
      const c = mount(s, deck), dd = mount(e2, deck);
      X.connectFlow(c.host, dd.host);
      const outs = [...c.host.querySelectorAll('.el')].map(el => ({ k: kindOf(el), t: el.className, d: delayOf(el) }));
      const headOut = outs.find(x => x.k === 'head'), artOut = outs.filter(x => /sculpture|wires/.test(x.t)).map(x => x.d);
      c.remove(); dd.remove();
      const probs = [];
      if (art.some(d => d > head)) probs.push('a graphic arrives after the headline');
      if (headOut && artOut.some(d => d < headOut.d)) probs.push('a graphic leaves before the headline');
      return probs.length ? probs.join('\n') : true;
    });
    const flowCheck = (d) => () => {
      const bad = [];
      for (let i = 0; i < d.slides.length - 1; i++) {
        if ((d.slides[i + 1].transition || 'fade') !== 'flow') continue;
        flowProblems(d.slides[i], d.slides[i + 1], d).forEach(p => bad.push(`${i + 1} → ${i + 2}: ${p}`));
      }
      return bad.length ? { pass: false, detail: bad.join('\n') } : true;
    };
    await test('Built-in deck: every Flow change plays in reading order', flowCheck(deck));
    if (mine) await test('Your deck: every Flow change plays in reading order', flowCheck(mine));

    group('Presenting');
    X.Store.deck = X.connectDeck();
    await test('Present opens on the selected slide', async () => {
      X.Store.gotoSlide(5);
      W.document.querySelector('[data-act="present"]').click();
      await sleep(300);
      const hud = W.document.getElementById('hudNum').textContent;
      const ok = X.Present.active && hud.startsWith('6 /');
      return ok ? true : `expected slide 6, HUD shows "${hud}"`;
    });
    await test('Resizing mid-entrance refits instead of rebuilding', async () => {
      const before = W.document.querySelector('.present-stage .slide-host');
      W.dispatchEvent(new W.Event('resize'));
      await sleep(100);
      const after = W.document.querySelector('.present-stage .slide-host');
      return before && before === after ? true : 'the slide was rebuilt on resize (entrance would replay)';
    });
    await test('Advancing leaves exactly one slide on stage', async () => {
      X.Present.next(); await sleep(150); X.Present.next();
      await sleep(3200);
      const n = W.document.querySelectorAll('.present-stage .slide-host').length;
      return n === 1 ? true : `${n} slides stacked on stage`;
    });
    await test('A second talk still has a working form', async () => {
      X.Present.stop(); await sleep(200);
      X.Present.start(1); await sleep(400);
      const c = W.document.querySelector('.present-form');
      const gl = c && c.getContext('webgl');
      const ok = gl && !gl.isContextLost();
      X.Present.stop();
      return ok ? true : 'the form canvas has a lost WebGL context';
    });

    group('Export');
    // The export is played with a kit slide on the end, so the embedded
    // sculpture runtime and element builds are exercised too.
    deck.slides.push(X.makeSlide({ transition: 'flow', bg: '#000000', elements: [
      X.makeElement('sculpture', { x: 1000, y: 160, w: 760, h: 760 }),
      X.makeElement('lens', { x: 140, y: 600, w: 1200, h: 380 }),
      X.makeElement('wires', { x: 0, y: 200, w: 1920, h: 600 }),
      X.makeElement('bands', { x: 140, y: 140, w: 500, h: 300 }),
      X.makeElement('halftone', { x: 700, y: 140, w: 300, h: 300 }),
      X.makeElement('text', { role: 'title', text: 'Kit slide', x: 140, y: 460, w: 900, h: 100 }),
    ]}));
    let html = '';
    await test('Standalone HTML builds and compiles', () => {
      html = X.Exporter.buildHTML(deck);
      const js = html.match(/<script>([\s\S]*)<\/script>/);
      if (!js) return 'no player script in the export';
      new Function(js[1]);   // throws on a syntax error
      return { pass: true, detail: Math.round(html.length / 1024) + ' KB' };
    });
    await test('Export plays every slide forward and back', async () => {
      if (!html) return 'no export to play';
      const f = document.createElement('iframe');
      f.style.cssText = 'position:fixed;left:-3000px;top:0;width:1280px;height:720px;border:0';
      document.body.appendChild(f);
      const errs = [];
      await new Promise(r => { f.onload = r; f.srcdoc = html; });
      const w = f.contentWindow;
      w.addEventListener('error', e => errs.push(e.message));
      const key = k => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k }));
      const n = deck.slides.length;
      for (let i = 1; i < n; i++) { key('ArrowRight'); await sleep(140); }
      await sleep(2600);
      const end = w.document.getElementById('n').textContent;
      key('ArrowLeft'); await sleep(2800);
      const back = w.document.getElementById('n').textContent;
      const on = w.document.querySelectorAll('.pg.on');
      const visible = on.length === 1 && [...on[0].querySelectorAll('.el-anim')]
        .some(x => +w.getComputedStyle(x).opacity > .9);
      // Forward again to the kit slide and check its sculpture went live.
      key('ArrowRight'); await sleep(1200);
      const liveSculpt = w.document.querySelectorAll('.pg.on .e-sculpture.live canvas').length;
      f.remove();
      const probs = [];
      if (errs.length) probs.push('errors: ' + errs.join('; '));
      if (end !== `${n} / ${n}`) probs.push(`forward ended on "${end}"`);
      if (back !== `${n - 1} / ${n}`) probs.push(`back landed on "${back}"`);
      if (!visible) probs.push(`after going back, ${on.length} page(s) on and no visible content`);
      if (!liveSculpt) probs.push('the kit slide\'s sculpture did not go live in the export');
      return probs.length ? { pass: false, detail: probs.join('\n') } : true;
    });

    paintSummary(true);
  }

  document.getElementById('again').onclick = run;
  run();
})();
</script>
</body>
</html>
